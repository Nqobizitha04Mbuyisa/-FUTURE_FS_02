# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Jackson ----
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET:ZmQ4MjE3MDM0YzVlMDljYmQwYzQ1OWY3ZjgyMzY1MmE1Y2VkMTQzMmM3OWFhMmRlOTMxNGY1NzdmMzM5MDIzZQ==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.issuer=mini-crm

# ---- CORS ----
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Default Admin Seed ----
